services:
  clam_base:
    build:
      context: .
      dockerfile: Dockerfile
      target: clam_base
    image: clam_base:latest
    volumes:
      - clamd_run:/var/run/clamav

  scancan:
    build:
      context: .
      dockerfile: Dockerfile.scancan
    container_name: scancan
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
      - CLAMD_CONN=socket
      - CLAMD_SOCKET=/var/run/clamav/clamd.ctl
    volumes:
      - ./scancan:/app/scancan:ro
      - ./clamdb:/opt/clamav
      - ./clamav_config:/etc/clamav:ro
      - ./LICENSE:/app/LICENSE:ro
      - ./README.md:/app/README.md:ro
      - clamd_run:/var/run/clamav
    restart: unless-stopped
    depends_on:
      - clam_base

  fresh_clam:
    build:
      context: .
      dockerfile: Dockerfile.freshclam
    container_name: fresh_clam
    volumes:
      - ./clamdb:/opt/clamav
      - ./clamav_config:/etc/clamav
    restart: unless-stopped
    depends_on:
      - clam_base

volumes:
  clamd_run: