[project]
authors = [
    {name = "Bradley Sacks", email = "bradsacks99@gmail.com"},
]
license = {text = "GPL-3.0-only"}
requires-python = ">=3.12,<4.0"

name = "ScanCan"
version = "0.1.0"
description = "Virus Scanning API"
readme = "README.md"

dependencies = [
    "fastapi[standard]>=0.79.1,<1.0.0",
    "pyvalve==0.1.5",
    "aiofile>=3.8.8,<4.0.0",
    "python-multipart>=0.0.5,<1.0.0",
    "aiopathlib>=0.5.0,<1.0.0",
    "aiohttp>=3.9.1,<4.0.0",
    "aiopath>=0.5.12",
]

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.4",
    "ruff>=0.4.0",
    "pytest-cov<5.0.0,>=4.1.0",
    "pytest-mypy<1.0.0,>=0.9.1",
    "pre-commit>=3.5.0"
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "ARG", "PL"]
ignore = ["FIX001", "FIX002", "FIX003", "FIX004", "N818", "PLR2004"]

[tool.pdm.build]
includes = []
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
